<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Graphic Canvas - Wizualny Notatnik</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      user-select: none;
      overflow: hidden;
      overscroll-behavior: none;
    }
    .grid-bg {
      background-size: 30px 30px;
      background-image: 
        radial-gradient(circle, rgba(156, 163, 175, 0.3) 1px, transparent 1px);
    }
    .dark .grid-bg {
      background-image: 
        radial-gradient(circle, rgba(75, 85, 99, 0.4) 1px, transparent 1px);
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
    }
    .dark .glass-panel {
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(12px);
    }
    canvas {
      touch-action: none;
    }
    .note-card {
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 h-screen w-screen flex flex-col font-sans transition-colors duration-200">

  <!-- Pasek górny (Header) -->
  <header class="glass-panel border-b border-gray-200 dark:border-gray-800 px-3 py-2 flex flex-wrap items-center justify-between gap-2 z-20 shadow-sm">
    <div class="flex items-center space-x-2">
      <div class="bg-indigo-600 text-white p-1.5 rounded-lg shadow-md">
        <i data-lucide="layout" class="w-4 h-4"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm sm:text-base leading-tight">Graphic Notebook</h1>
      </div>
    </div>

    <!-- Wyszukiwanie i Filtry -->
    <div class="flex items-center space-x-2 flex-1 max-w-xs sm:max-w-md mx-1">
      <div class="relative w-full">
        <i data-lucide="search" class="absolute left-2.5 top-2 text-gray-400 w-3.5 h-3.5"></i>
        <input type="text" id="searchInput" placeholder="Szukaj notatek..." class="w-full pl-8 pr-3 py-1 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <select id="tagFilter" class="bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg text-xs px-2 py-1 focus:outline-none focus:ring-2 focus:ring-indigo-500 hidden sm:block">
        <option value="ALL">Wszystkie</option>
        <option value="Moodboard">Moodboard</option>
        <option value="Refka">Refka</option>
        <option value="Szkic">Szkic</option>
        <option value="Inne">Inne</option>
      </select>
    </div>

    <!-- Przełącznik widoku & Akcje -->
    <div class="flex items-center space-x-1">
      <div class="bg-gray-200 dark:bg-gray-800 p-0.5 rounded-lg flex space-x-1">
        <button id="viewBoardBtn" class="px-2.5 py-1 text-xs font-medium rounded-md bg-white dark:bg-gray-700 shadow-sm flex items-center space-x-1">
          <i data-lucide="move" class="w-3 h-3"></i>
          <span class="hidden sm:inline">Tablica</span>
        </button>
        <button id="viewGridBtn" class="px-2.5 py-1 text-xs font-medium rounded-md text-gray-600 dark:text-gray-400 hover:text-gray-900 flex items-center space-x-1">
          <i data-lucide="grid" class="w-3 h-3"></i>
          <span class="hidden sm:inline">Siatka</span>
        </button>
      </div>

      <button id="exportPngBtn" title="Eksportuj jako PNG" class="p-1.5 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-lg text-gray-600 dark:text-gray-300 hidden sm:block">
        <i data-lucide="download" class="w-4 h-4"></i>
      </button>
      <button id="exportJsonBtn" title="Zapisz projekt (JSON)" class="p-1.5 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-lg text-gray-600 dark:text-gray-300">
        <i data-lucide="file-json" class="w-4 h-4"></i>
      </button>
      <label title="Wczytaj projekt" class="p-1.5 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-lg text-gray-600 dark:text-gray-300 cursor-pointer">
        <i data-lucide="upload" class="w-4 h-4"></i>
        <input type="file" id="importJsonInput" accept=".json" class="hidden">
      </label>

      <button id="toggleThemeBtn" class="p-1.5 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-lg text-gray-600 dark:text-gray-300">
        <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
        <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
      </button>
    </div>
  </header>

  <!-- Główny kontener -->
  <div class="flex-1 relative overflow-hidden flex">
    
    <!-- Pływający Toolbar -->
    <div id="boardToolbar" class="absolute bottom-4 left-1/2 -translate-x-1/2 max-w-[95vw] overflow-x-auto no-scrollbar z-10 glass-panel border border-gray-200 dark:border-gray-700 rounded-2xl p-1.5 shadow-2xl flex items-center space-x-1 whitespace-nowrap">
      
      <button id="toolSelect" title="Zaznacz / Przesuń / Skaluj obiekt dwoma palcami" class="p-2 rounded-xl bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400">
        <i data-lucide="mouse-pointer" class="w-5 h-5"></i>
      </button>
      
      <button id="toolPan" title="Przesuwanie całej tablicy (Rączka)" class="p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300">
        <i data-lucide="hand" class="w-5 h-5"></i>
      </button>

      <button id="toolDraw" title="Pędzel / Rysowanie" class="p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300">
        <i data-lucide="pencil" class="w-5 h-5"></i>
      </button>
      
      <!-- Opcje Pędzla -->
      <div id="brushOptions" class="hidden items-center space-x-2 px-2 border-l border-gray-300 dark:border-gray-700">
        <input type="color" id="brushColor" value="#4f46e5" class="w-6 h-6 rounded cursor-pointer border-0 bg-transparent">
        <input type="range" id="brushSize" min="2" max="30" value="4" class="w-16">
      </div>

      <div class="h-5 w-px bg-gray-300 dark:border-gray-700"></div>

      <!-- Dodawanie obiektów -->
      <label title="Dodaj Obraz z Dysku" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-xl text-gray-700 dark:text-gray-300 cursor-pointer">
        <i data-lucide="image" class="w-5 h-5"></i>
        <input type="file" id="imageLoader" accept="image/*" class="hidden">
      </label>
      <button id="addStickyBtn" title="Dodaj Karteczkę" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-xl text-gray-700 dark:text-gray-300">
        <i data-lucide="sticky-note" class="w-5 h-5"></i>
      </button>
      <button id="clearBoardBtn" title="Wyczyść Tablicę" class="p-2 hover:bg-red-100 text-red-600 rounded-xl">
        <i data-lucide="trash-2" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Sterowanie Przybliżeniem -->
    <div id="zoomControls" class="absolute top-4 right-4 z-10 glass-panel border border-gray-200 dark:border-gray-700 rounded-xl p-1 flex items-center space-x-1 shadow-lg">
      <button id="zoomOut" class="p-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg"><i data-lucide="minus" class="w-3.5 h-3.5"></i></button>
      <span id="zoomVal" class="text-xs font-semibold px-1 w-10 text-center">100%</span>
      <button id="zoomIn" class="p-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg"><i data-lucide="plus" class="w-3.5 h-3.5"></i></button>
    </div>

    <!-- WIDOK 1: Nieskończona Tablica (Canvas Board) -->
    <div id="boardContainer" class="w-full h-full relative overflow-hidden grid-bg cursor-default">
      <canvas id="paintCanvas" class="absolute top-0 left-0 pointer-events-none z-0"></canvas>
      <div id="elementsLayer" class="absolute top-0 left-0 w-full h-full z-1"></div>
    </div>

    <!-- WIDOK 2: Grid / Lista -->
    <div id="gridContainer" class="hidden w-full h-full overflow-y-auto p-4 sm:p-6 bg-gray-50 dark:bg-gray-900 pb-24">
      <div id="gridItems" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </div>

  </div>

  <script>
    const state = {
      view: 'board',
      tool: 'select', // 'select', 'pan', 'draw'
      zoom: 1,
      pan: { x: 0, y: 0 },
      isPanning: false,
      startPan: { x: 0, y: 0 },
      items: [],
      selectedItemId: null,
      draggingItemId: null,
      dragOffset: { x: 0, y: 0 },
      isDrawing: false,
      drawPaths: [],
      currentPath: null,
      // Stan gestów pinch-to-zoom / pinch-scale
      initialPinchDist: 0,
      initialItemWidth: 0,
      initialBoardZoom: 1
    };

    const boardContainer = document.getElementById('boardContainer');
    const elementsLayer = document.getElementById('elementsLayer');
    const paintCanvas = document.getElementById('paintCanvas');
    const ctx = paintCanvas.getContext('2d');
    const gridContainer = document.getElementById('gridContainer');
    const gridItems = document.getElementById('gridItems');

    function init() {
      lucide.createIcons();
      resizeCanvas();
      loadFromLocalStorage();
      setupEventListeners();
      render();
    }

    function resizeCanvas() {
      paintCanvas.width = boardContainer.clientWidth;
      paintCanvas.height = boardContainer.clientHeight;
      redrawCanvas();
    }

    function setTool(toolName) {
      state.tool = toolName;
      
      const selectBtn = document.getElementById('toolSelect');
      const panBtn = document.getElementById('toolPan');
      const drawBtn = document.getElementById('toolDraw');
      const brushOpts = document.getElementById('brushOptions');

      [selectBtn, panBtn, drawBtn].forEach(b => {
        b.className = "p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300";
      });

      brushOpts.classList.add('hidden');
      brushOpts.classList.remove('flex');

      if (toolName === 'select') {
        selectBtn.className = "p-2 rounded-xl bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400";
        boardContainer.style.cursor = 'default';
      } else if (toolName === 'pan') {
        panBtn.className = "p-2 rounded-xl bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400";
        boardContainer.style.cursor = 'grab';
      } else if (toolName === 'draw') {
        drawBtn.className = "p-2 rounded-xl bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400";
        brushOpts.classList.remove('hidden');
        brushOpts.classList.add('flex');
        boardContainer.style.cursor = 'crosshair';
      }
    }

    function render() {
      if (state.view === 'board') {
        boardContainer.classList.remove('hidden');
        gridContainer.classList.add('hidden');
        document.getElementById('boardToolbar').classList.remove('hidden');
        document.getElementById('zoomControls').classList.remove('hidden');
        renderBoardElements();
      } else {
        boardContainer.classList.add('hidden');
        gridContainer.classList.remove('hidden');
        document.getElementById('boardToolbar').classList.add('hidden');
        document.getElementById('zoomControls').classList.add('hidden');
        renderGridView();
      }
    }

    function renderBoardElements() {
      elementsLayer.innerHTML = '';
      elementsLayer.style.transform = `translate(${state.pan.x}px, ${state.pan.y}px) scale(${state.zoom})`;

      const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
      const selectedTag = document.getElementById('tagFilter').value;

      state.items.forEach(item => {
        const matchesSearch = (item.title || '').toLowerCase().includes(searchKeyword) || (item.content || '').toLowerCase().includes(searchKeyword);
        const matchesTag = selectedTag === 'ALL' || item.tag === selectedTag;

        if (!matchesSearch || !matchesTag) return;

        const isSelected = state.selectedItemId === item.id;
        const el = document.createElement('div');
        el.setAttribute('data-id', item.id);
        
        if (item.type === 'image') {
          el.className = `absolute note-card rounded-xl shadow-lg border-2 transition-all ${isSelected ? 'border-indigo-500 ring-4 ring-indigo-500/20 shadow-2xl z-20' : 'border-transparent shadow-md z-1'}`;
          el.style.left = `${item.x}px`;
          el.style.top = `${item.y}px`;
          el.style.width = `${item.width}px`;
          
          el.innerHTML = `
            <div class="relative w-full h-full group">
              <img src="${item.content}" class="w-full h-auto object-cover rounded-lg pointer-events-none block" />
              <button onclick="event.stopPropagation(); deleteItem('${item.id}')" class="absolute top-2 right-2 bg-black/60 hover:bg-red-600 text-white p-1.5 rounded-full backdrop-blur-md ${isSelected ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'} transition-opacity shadow-md">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          `;
        } else if (item.type === 'note') {
          el.className = `absolute note-card rounded-xl shadow-md border-2 ${isSelected ? 'border-indigo-500 ring-4 ring-indigo-500/20 shadow-xl z-20' : 'border-transparent z-1'} overflow-hidden`;
          el.style.left = `${item.x}px`;
          el.style.top = `${item.y}px`;
          el.style.width = `${item.width}px`;
          el.style.backgroundColor = item.color || '#fef08a';
          el.className += ' text-gray-900';
          el.innerHTML = `
            <div class="p-3 flex flex-col h-full min-h-[130px]">
              <input type="text" value="${item.title || ''}" placeholder="Tytuł..." class="font-bold text-xs bg-transparent border-b border-black/10 focus:outline-none mb-1.5 placeholder-gray-700" data-id="${item.id}" data-field="title">
              <textarea placeholder="Treść..." class="w-full flex-1 bg-transparent border-none focus:outline-none text-xs resize-none placeholder-gray-600" data-id="${item.id}" data-field="content">${item.content || ''}</textarea>
              <div class="flex items-center justify-between mt-1 pt-1 border-t border-black/10">
                <select data-id="${item.id}" data-field="tag" class="text-[10px] bg-black/10 px-1.5 py-0.5 rounded border-none outline-none">
                  <option value="Moodboard" ${item.tag === 'Moodboard' ? 'selected' : ''}>Moodboard</option>
                  <option value="Refka" ${item.tag === 'Refka' ? 'selected' : ''}>Refka</option>
                  <option value="Szkic" ${item.tag === 'Szkic' ? 'selected' : ''}>Szkic</option>
                  <option value="Inne" ${item.tag === 'Inne' ? 'selected' : ''}>Inne</option>
                </select>
                <button onclick="event.stopPropagation(); deleteItem('${item.id}')" class="text-red-800 hover:text-red-950 p-1">
                  <i data-lucide="trash" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            </div>
          `;
        }

        bindItemEvents(el, item);
        elementsLayer.appendChild(el);
      });
      lucide.createIcons();
    }

    function renderGridView() {
      gridItems.innerHTML = '';
      const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
      const selectedTag = document.getElementById('tagFilter').value;

      state.items.forEach(item => {
        const matchesSearch = (item.title || '').toLowerCase().includes(searchKeyword) || (item.content || '').toLowerCase().includes(searchKeyword);
        const matchesTag = selectedTag === 'ALL' || item.tag === selectedTag;

        if (!matchesSearch || !matchesTag) return;

        const card = document.createElement('div');
        card.className = "bg-white dark:bg-gray-800 rounded-xl shadow border border-gray-200 dark:border-gray-700 overflow-hidden flex flex-col";
        
        if (item.type === 'image') {
          card.innerHTML = `<img src="${item.content}" class="w-full h-48 object-cover" />`;
        } else {
          card.style.backgroundColor = item.color || '#fef08a';
          card.innerHTML = `
            <div class="p-3 text-gray-900">
              <span class="inline-block px-2 py-0.5 text-[10px] font-semibold bg-black/10 rounded mb-1">${item.tag || 'Brak'}</span>
              <h3 class="font-bold text-xs mb-1">${item.title || 'Bez tytułu'}</h3>
              <p class="text-[11px] whitespace-pre-wrap">${item.content || ''}</p>
            </div>
          `;
        }
        gridItems.appendChild(card);
      });
    }

    function getDistance(t1, t2) {
      const dx = t1.clientX - t2.clientX;
      const dy = t1.clientY - t2.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    // Podpinanie zdarzeń do obrazu / karteczki
    function bindItemEvents(el, item) {
      el.addEventListener('mousedown', (e) => {
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) || e.target.closest('button')) return;
        if (state.tool === 'pan') return;

        e.stopPropagation();
        state.selectedItemId = item.id;
        state.draggingItemId = item.id;
        state.dragOffset = {
          x: e.clientX - item.x * state.zoom,
          y: e.clientY - item.y * state.zoom
        };
        renderBoardElements();
      });

      el.addEventListener('touchstart', (e) => {
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) || e.target.closest('button')) return;
        if (state.tool === 'pan') return;

        e.stopPropagation();

        if (e.touches.length === 1) {
          state.selectedItemId = item.id;
          state.draggingItemId = item.id;
          state.dragOffset = {
            x: e.touches[0].clientX - item.x * state.zoom,
            y: e.touches[0].clientY - item.y * state.zoom
          };
          renderBoardElements();
        } else if (e.touches.length === 2 && state.tool === 'select') {
          // Początek skali obrazka dwoma palcami
          state.selectedItemId = item.id;
          state.draggingItemId = null; // wyłącz przesuwanie
          state.initialPinchDist = getDistance(e.touches[0], e.touches[1]);
          state.initialItemWidth = item.width;
        }
      }, { passive: false });
    }

    function redrawCanvas() {
      ctx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
      ctx.save();
      ctx.translate(state.pan.x, state.pan.y);
      ctx.scale(state.zoom, state.zoom);

      state.drawPaths.forEach(path => {
        if (path.points.length < 2) return;
        ctx.beginPath();
        ctx.strokeStyle = path.color;
        ctx.lineWidth = path.size;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.moveTo(path.points[0].x, path.points[0].y);
        for (let i = 1; i < path.points.length; i++) {
          ctx.lineTo(path.points[i].x, path.points[i].y);
        }
        ctx.stroke();
      });

      ctx.restore();
    }

    function setupEventListeners() {
      window.addEventListener('resize', resizeCanvas);

      elementsLayer.addEventListener('input', (e) => {
        const id = e.target.dataset.id;
        const field = e.target.dataset.field;
        if (!id || !field) return;
        const item = state.items.find(i => i.id === id);
        if (item) {
          item[field] = e.target.value;
          saveToLocalStorage();
        }
      });

      // Globalne powiększanie (Zoom) lub Przesuwanie tablicy
      const handleGlobalStart = (clientX, clientY, e) => {
        if (state.tool === 'draw') {
          state.isDrawing = true;
          const rect = boardContainer.getBoundingClientRect();
          const x = (clientX - rect.left - state.pan.x) / state.zoom;
          const y = (clientY - rect.top - state.pan.y) / state.zoom;
          state.currentPath = {
            color: document.getElementById('brushColor').value,
            size: document.getElementById('brushSize').value,
            points: [{ x, y }]
          };
          state.drawPaths.push(state.currentPath);
          return;
        }

        state.isPanning = true;
        state.startPan = { x: clientX - state.pan.x, y: clientY - state.pan.y };
      };

      const handleGlobalMove = (clientX, clientY) => {
        // Przesuwanie obiektu jednokrotnym dotknięciem
        if (state.draggingItemId && state.tool === 'select') {
          const item = state.items.find(i => i.id === state.draggingItemId);
          if (item) {
            item.x = (clientX - state.dragOffset.x) / state.zoom;
            item.y = (clientY - state.dragOffset.y) / state.zoom;
            const el = elementsLayer.querySelector(`[data-id="${item.id}"]`);
            if (el) {
              el.style.left = `${item.x}px`;
              el.style.top = `${item.y}px`;
            }
          }
          return;
        }

        // Przesuwanie tablicy
        if (state.isPanning) {
          state.pan.x = clientX - state.startPan.x;
          state.pan.y = clientY - state.startPan.y;
          elementsLayer.style.transform = `translate(${state.pan.x}px, ${state.pan.y}px) scale(${state.zoom})`;
          redrawCanvas();
          return;
        }

        // Rysowanie
        if (state.isDrawing && state.currentPath) {
          const rect = boardContainer.getBoundingClientRect();
          const x = (clientX - rect.left - state.pan.x) / state.zoom;
          const y = (clientY - rect.top - state.pan.y) / state.zoom;
          state.currentPath.points.push({ x, y });
          redrawCanvas();
        }
      };

      const handleGlobalEnd = () => {
        if (state.draggingItemId) {
          state.draggingItemId = null;
          saveToLocalStorage();
        }
        if (state.isPanning) {
          state.isPanning = false;
        }
        if (state.isDrawing) {
          state.isDrawing = false;
          state.currentPath = null;
          saveToLocalStorage();
        }
        state.initialPinchDist = 0;
      };

      boardContainer.addEventListener('mousedown', (e) => {
        if (e.target === boardContainer || e.target === paintCanvas || e.target === elementsLayer) {
          state.selectedItemId = null;
          renderBoardElements();
        }
        handleGlobalStart(e.clientX, e.clientY, e);
      });

      // GESTY DOTYKOWE (PINCH-TO-ZOOM I PINCH-SCALE)
      boardContainer.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          state.draggingItemId = null;
          state.isPanning = false;
          state.initialPinchDist = getDistance(e.touches[0], e.touches[1]);
          state.initialBoardZoom = state.zoom;

          // Jeśli zaznaczony jest obrazek, zapisujemy też jego początkową szerokość
          if (state.selectedItemId && state.tool === 'select') {
            const item = state.items.find(i => i.id === state.selectedItemId);
            if (item) state.initialItemWidth = item.width;
          }
        } else if (e.touches.length === 1) {
          if (e.target === boardContainer || e.target === paintCanvas || e.target === elementsLayer) {
            state.selectedItemId = null;
            renderBoardElements();
          }
          handleGlobalStart(e.touches[0].clientX, e.touches[0].clientY, e);
        }
      }, { passive: false });

      boardContainer.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && state.initialPinchDist > 0) {
          const currentDist = getDistance(e.touches[0], e.touches[1]);
          const scale = currentDist / state.initialPinchDist;

          // Skalowanie wskazanego zdjęcia dwoma palcami
          if (state.selectedItemId && state.tool === 'select') {
            const item = state.items.find(i => i.id === state.selectedItemId);
            if (item) {
              const newWidth = Math.min(Math.max(80, state.initialItemWidth * scale), 1200);
              item.width = newWidth;
              const el = elementsLayer.querySelector(`[data-id="${item.id}"]`);
              if (el) el.style.width = `${newWidth}px`;
            }
          } else {
            // Skalowanie przybliżenia całej tablicy
            state.zoom = Math.min(Math.max(0.2, state.initialBoardZoom * scale), 3);
            document.getElementById('zoomVal').innerText = `${Math.round(state.zoom * 100)}%`;
            renderBoardElements();
            redrawCanvas();
          }
        } else if (e.touches.length === 1) {
          handleGlobalMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: false });

      window.addEventListener('mousemove', (e) => handleGlobalMove(e.clientX, e.clientY));
      window.addEventListener('mouseup', handleGlobalEnd);
      window.addEventListener('touchend', handleGlobalEnd);

      boardContainer.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
        state.zoom = Math.min(Math.max(0.2, state.zoom * zoomFactor), 3);
        document.getElementById('zoomVal').innerText = `${Math.round(state.zoom * 100)}%`;
        renderBoardElements();
        redrawCanvas();
      }, { passive: false });

      document.getElementById('viewBoardBtn').addEventListener('click', () => {
        state.view = 'board';
        document.getElementById('viewBoardBtn').className = "px-2.5 py-1 text-xs font-medium rounded-md bg-white dark:bg-gray-700 shadow-sm flex items-center space-x-1";
        document.getElementById('viewGridBtn').className = "px-2.5 py-1 text-xs font-medium rounded-md text-gray-600 dark:text-gray-400 hover:text-gray-900 flex items-center space-x-1";
        render();
      });

      document.getElementById('viewGridBtn').addEventListener('click', () => {
        state.view = 'grid';
        document.getElementById('viewGridBtn').className = "px-2.5 py-1 text-xs font-medium rounded-md bg-white dark:bg-gray-700 shadow-sm flex items-center space-x-1";
        document.getElementById('viewBoardBtn').className = "px-2.5 py-1 text-xs font-medium rounded-md text-gray-600 dark:text-gray-400 hover:text-gray-900 flex items-center space-x-1";
        render();
      });

      // Narzędzia
      document.getElementById('toolSelect').addEventListener('click', () => setTool('select'));
      document.getElementById('toolPan').addEventListener('click', () => setTool('pan'));
      document.getElementById('toolDraw').addEventListener('click', () => setTool('draw'));

      document.getElementById('addStickyBtn').addEventListener('click', () => {
        const colors = ['#fef08a', '#bbf7d0', '#bfdbfe', '#fbcfe8', '#fed7aa'];
        const randomColor = colors[Math.floor(Math.random() * colors.length)];
        const newId = Date.now().toString();
        state.items.push({
          id: newId,
          type: 'note',
          x: -state.pan.x + 60 + Math.random() * 40,
          y: -state.pan.y + 60 + Math.random() * 40,
          width: 200,
          title: 'Notatka',
          content: '',
          tag: 'Moodboard',
          color: randomColor
        });
        state.selectedItemId = newId;
        saveToLocalStorage();
        renderBoardElements();
      });

      document.getElementById('imageLoader').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const newId = Date.now().toString();
          state.items.push({
            id: newId,
            type: 'image',
            x: -state.pan.x + 60 + Math.random() * 30,
            y: -state.pan.y + 60 + Math.random() * 30,
            width: 240,
            title: file.name.split('.')[0],
            content: event.target.result,
            tag: 'Refka'
          });
          state.selectedItemId = newId;
          saveToLocalStorage();
          renderBoardElements();
        };
        reader.readAsDataURL(file);
      });

      window.addEventListener('paste', (e) => {
        const items = e.clipboardData.items;
        for (let item of items) {
          if (item.type.indexOf('image') !== -1) {
            const file = item.getAsFile();
            const reader = new FileReader();
            reader.onload = (event) => {
              const newId = Date.now().toString();
              state.items.push({
                id: newId,
                type: 'image',
                x: -state.pan.x + 60 + Math.random() * 30,
                y: -state.pan.y + 60 + Math.random() * 30,
                width: 240,
                title: 'Wklejony obraz',
                content: event.target.result,
                tag: 'Refka'
              });
              state.selectedItemId = newId;
              saveToLocalStorage();
              renderBoardElements();
            };
            reader.readAsDataURL(file);
          }
        }
      });

      document.getElementById('searchInput').addEventListener('input', render);
      document.getElementById('tagFilter').addEventListener('change', render);

      document.getElementById('clearBoardBtn').addEventListener('click', () => {
        if (confirm('Czy na pewno chcesz wyczyścić tablicę?')) {
          state.items = [];
          state.drawPaths = [];
          state.selectedItemId = null;
          saveToLocalStorage();
          redrawCanvas();
          renderBoardElements();
        }
      });

      document.getElementById('zoomIn').addEventListener('click', () => {
        state.zoom = Math.min(3, state.zoom + 0.1);
        document.getElementById('zoomVal').innerText = `${Math.round(state.zoom * 100)}%`;
        renderBoardElements();
        redrawCanvas();
      });
      document.getElementById('zoomOut').addEventListener('click', () => {
        state.zoom = Math.max(0.2, state.zoom - 0.1);
        document.getElementById('zoomVal').innerText = `${Math.round(state.zoom * 100)}%`;
        renderBoardElements();
        redrawCanvas();
      });

      document.getElementById('toggleThemeBtn').addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
      });

      document.getElementById('exportJsonBtn').addEventListener('click', () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
          items: state.items,
          drawPaths: state.drawPaths
        }));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `graphic-notebook-${Date.now()}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      });

      document.getElementById('importJsonInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            state.items = data.items || [];
            state.drawPaths = data.drawPaths || [];
            saveToLocalStorage();
            redrawCanvas();
            renderBoardElements();
          } catch (err) {
            alert('Błąd wczytywania pliku JSON.');
          }
        };
        reader.readAsText(file);
      });
    }

    window.deleteItem = function(id) {
      state.items = state.items.filter(item => item.id !== id);
      if (state.selectedItemId === id) state.selectedItemId = null;
      saveToLocalStorage();
      renderBoardElements();
    };

    function saveToLocalStorage() {
      localStorage.setItem('graphic_notebook_data', JSON.stringify({
        items: state.items,
        drawPaths: state.drawPaths
      }));
    }

    function loadFromLocalStorage() {
      const saved = localStorage.getItem('graphic_notebook_data');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          state.items = parsed.items || [];
          state.drawPaths = parsed.drawPaths || [];
        } catch (e) {
          console.error("Błąd localStorage", e);
        }
      }
    }

    init();
  </script>
</body>
</html>
